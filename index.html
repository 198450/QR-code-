<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博二维码生成器</title>
    <!-- 引入二维码生成库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', sans-serif; }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #38bdf8, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.desc {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            color: #fff;
            font-size: 1rem;
            resize: none;
            outline: none;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        textarea:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #38bdf8, #3b82f6);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 30px;
        }

        .btn:active { transform: scale(0.98); }

        /* 二维码展示区 */
        .qr-wrapper {
            display: none; /* 默认隐藏 */
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.5s ease-out;
        }

        #qrcode {
            background: #fff;
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        /* 下载按钮 */
        .download-btn {
            background: #10b981;
            margin-bottom: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tip {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>赛博二维码</h1>
        <p class="desc">输入文字或网址，瞬间生成高清二维码</p>

        <textarea id="textInput" placeholder="在这里输入你要隐藏的文字或网址..."></textarea>
        <button class="btn" id="genBtn">生成二维码</button>

        <div class="qr-wrapper" id="qrWrapper">
            <!-- 二维码会生成在这个 div 里 -->
            <div id="qrcode"></div>
            <button class="btn download-btn" id="downloadBtn">保存二维码图片</button>
            <div class="tip">提示：你可以把上千字的文章塞进去，别人一扫就能看。</div>
        </div>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const genBtn = document.getElementById('genBtn');
        const qrWrapper = document.getElementById('qrWrapper');
        const qrcodeDiv = document.getElementById('qrcode');
        const downloadBtn = document.getElementById('downloadBtn');

        let qrCodeInstance = null;

        genBtn.addEventListener('click', () => {
            const text = textInput.value.trim();
            if (!text) {
                alert("请先输入内容！");
                return;
            }

            // 显示展示区
            qrWrapper.style.display = 'flex';

            // 如果之前生成过，先清空
            qrcodeDiv.innerHTML = '';

            // 生成新的二维码
            qrCodeInstance = new QRCode(qrcodeDiv, {
                text: text,
                width: 200,
                height: 200,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H // 最高容错率
            });
        });

        // 下载功能（把 canvas 转成图片下载）
        downloadBtn.addEventListener('click', () => {
            // QRCode.js 会在 div 里生成一个 canvas 和一个 img
            const canvas = qrcodeDiv.querySelector('canvas');
            if (canvas) {
                // 为了高清，我们创建一个更大的 canvas 重新画一次
                const highResCanvas = document.createElement('canvas');
                const size = 1000; // 1000x1000 高清图
                highResCanvas.width = size;
                highResCanvas.height = size;
                const ctx = highResCanvas.getContext('2d');
                
                // 设置白底
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, size, size);
                
                // 将原本的二维码放大画上去
                ctx.drawImage(canvas, 0, 0, size, size);

                // 触发下载
                const a = document.createElement('a');
                a.href = highResCanvas.toDataURL('image/png');
                a.download = 'my_qrcode.png';
                a.click();
            } else {
                alert("生成中，请稍后再试！");
            }
        });
    </script>
</body>
</html>
